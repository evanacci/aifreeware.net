<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password</title>
<meta name="description" content="Choose a new password for your aifreeware account.">
<meta name="robots" content="noindex">

<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#171717">
<!-- Synchronous on purpose. Deferring means the default colourway paints first
     and the chosen one snaps in after, which is the tell of a cheap picker. -->
<script src="/ub-config.js"></script>
<script src="/ub/theme.js"></script>
<style>
  :root{
    --bg:#171717;
    --lime:#e2f79c;
    --lime:var(--accent,#e2f79c);
    /* The engine names the readable ink --ub-on-accent. Aliased to the name the
       site has always used, same as --lime above. */
    --on-accent:var(--ub-on-accent,var(--bg));
    /* Keep the bar on the same 960px / 5vw grid as the other pages. */
    /* The module's own tokens. It falls back to CrumbProof's purple palette when a
       host defines none, so these are aifreeware's neutrals. Accent tokens are
       left alone: the engine sets those per colourway. */
    --ub-surface:#1c1c1c;
    --ub-ink-2:#141414;
    --ub-line:rgba(255,255,255,.12);
    --ub-line-soft:rgba(255,255,255,.07);
    --ub-text:#e8e8e8;
    --ub-muted:#6d6d6d;
    --ub-mono:var(--mono);
    --ub-sans:var(--mono);
    --ub-max:960px;
    --ub-pad:5vw;
    --gray:#8a8a8a;
    --gray-dim:#5a5a5a;
    --red:#ff8d8d;
    --pink:rgb(255,141,197);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
    --rule:rgba(226,247,156,0.14);
    --rule:color-mix(in srgb, var(--lime) 14%, transparent);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:var(--bg);color:var(--gray);
    font-family:var(--mono);font-size:13.5px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100dvh;
  }
  .chrome{
    flex:0 0 auto;border-bottom:1px solid var(--rule);
    padding:10px 16px;font-size:11.5px;color:var(--gray-dim);letter-spacing:0.06em;
  }
  .chrome a{color:var(--lime);text-decoration:none}
  .chrome a:hover{text-decoration:underline;text-underline-offset:3px}

  main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .box{width:min(30rem,100%);border:1px solid var(--rule)}
  .head{
    padding:11px 18px;border-bottom:1px solid var(--rule);
    font-size:11.5px;letter-spacing:0.06em;color:var(--gray-dim);
  }
  .head b{color:var(--lime);font-weight:400}
  .body{padding:20px 18px;display:grid;gap:1rem}
  label{display:grid;gap:0.35rem;font-size:11.5px;letter-spacing:0.05em;color:var(--gray-dim)}
  input{
    background:transparent;border:1px solid var(--rule);color:var(--gray);
    font:inherit;font-size:13.5px;padding:0.6em 0.7em;outline:0;caret-color:var(--lime);
  }
  input:focus{border-color:var(--lime);color:var(--lime)}
  .btn{
    background:transparent;border:1px solid var(--lime);color:var(--lime);
    font:inherit;font-size:12px;letter-spacing:0.05em;padding:0.6em 1.1em;cursor:pointer;
  }
  .btn:hover{background:var(--lime);color:var(--on-accent,var(--bg))}
  .btn[disabled]{opacity:0.45;cursor:default}
  .btn[disabled]:hover{background:transparent;color:var(--lime)}
  .msg{font-size:12.5px;line-height:1.6;min-height:1.2em}
  .msg:empty{display:none}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--lime)}
  .hint{font-size:12px;color:var(--gray-dim);margin:0}
  a.plain{color:var(--gray);text-decoration:underline;text-underline-offset:3px}
  a.plain:hover{color:var(--lime)}
  footer{
    flex:0 0 auto;border-top:1px solid var(--rule);
    padding:18px;text-align:center;
    font-size:9px;letter-spacing:0.05em;color:rgba(255,255,255,0.2);
  }
  footer a{color:inherit;text-decoration:none;transition:color 0.4s ease}
  footer a:hover{color:var(--pink)}
  input:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
</style>
</head>
<body>

<!-- The shared bar: the frame plus the colour piece. Config is /ub-config.js. -->
<script src="/ub/utilbar.js" defer></script>
<script src="/ub/utilbar-colour.js" defer></script>
<script src="/ub/utilbar-signin.js" defer></script>

<div class="chrome"><a href="/">aifreeware.net</a> <span>/ account</span></div>

<main>
  <form class="box" id="box" autocomplete="on">
    <div class="head"><b id="title">set a new password</b></div>
    <div class="body" id="body">
      <label>new password
        <input id="pw" name="password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>type it again
        <input id="pw2" name="password_confirm" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <p class="hint">At least 8 characters.</p>
      <p class="msg err" id="msg" role="alert"></p>
      <div><button class="btn" type="submit" id="go">set password</button></div>
    </div>
  </form>
</main>

<footer><p style="margin:0">by <a href="https://the9ines.com">the9ines</a></p></footer>

<script>
const q = new URLSearchParams(location.search);
const TOKEN = q.get('token');
const el = id => document.getElementById(id);
const msg = el('msg'), go = el('go'), pw = el('pw'), pw2 = el('pw2');

function say(text, kind){
  msg.textContent = text;
  msg.className = 'msg ' + (kind || 'err');
}

// Better Auth sends the reader to /api/auth/reset-password/<token>, which
// redirects here with the token on the query string. Arriving without one means
// the link was mangled in transit, or already used.
if(!TOKEN || q.get('error')){
  el('title').textContent = 'that link did not work';
  el('body').innerHTML =
    '<p class="hint">Password reset links work once and expire an hour after they are sent. '
  + 'This one has been used already, has expired, or was broken in transit.</p>'
  + '<p class="hint">Open the browser terminal and type <span style="color:var(--lime)">login</span>, '
  + 'then choose "forgot your password" to send a fresh one.</p>'
  + '<p><a class="plain" href="/run/">Go to the browser terminal</a></p>';
}

el('box').addEventListener('submit', async e => {
  e.preventDefault();
  if(!TOKEN) return;

  if(pw.value !== pw2.value) return say('Those two passwords are not the same.');
  if(pw.value.length < 8)    return say('Use at least 8 characters.');

  const label = go.textContent;
  say(''); go.disabled = true; go.textContent = 'working';
  try{
    const res = await fetch('/api/auth/reset-password', {
      method:'POST',
      headers:{'content-type':'application/json'},
      credentials:'same-origin',
      body: JSON.stringify({ newPassword: pw.value, token: TOKEN }),
    });
    let d = null; try{ d = await res.json(); }catch{}
    if(!res.ok){
      const said = d && (d.message || d.error);
      throw new Error(said || (res.status >= 500
        ? 'The service is not responding. Try again in a moment.'
        : 'That reset link is no longer valid. Send yourself a fresh one.'));
    }
    el('title').textContent = 'password set';
    el('body').innerHTML =
      '<p class="msg ok">Your password has been changed.</p>'
    + '<p class="hint">You can sign in with it now.</p>'
    + '<p><a class="plain" href="/run/">Go to the browser terminal</a></p>';
  }catch(err){
    say(err.message);
    go.disabled = false; go.textContent = label;
    pw.focus(); pw.select();
  }
});

pw.focus();
</script>
</body>
</html>
