<style>
  :root{
    --bg:#171717;
    --lime:#e2f79c;
    --gray:#8a8a8a;
    --gray-dim:#5a5a5a;
    --red:#ff8d8d;
    --pink:rgb(255,141,197);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
    --rule:rgba(226,247,156,0.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--gray);
    font-family:var(--mono);font-size:13.5px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }

  .chrome{
    flex:0 0 auto;
    border-bottom:1px solid var(--rule);
    padding:10px 16px;font-size:11.5px;color:var(--gray-dim);
    letter-spacing:0.06em;display:flex;justify-content:space-between;
    align-items:center;gap:1rem;
  }
  .chrome a{color:var(--gray-dim);text-decoration:none}
  .chrome a:hover{color:var(--lime)}
  .chrome .host{color:var(--lime)}
  #status{color:var(--gray-dim)}
  #status.ready{color:var(--lime)}

  #screen{
    flex:1 1 auto;overflow-y:auto;padding:16px;
    white-space:pre-wrap;word-break:break-word;
  }
  #screen .u{color:var(--lime)}          /* echoed user command */
  #screen .err{color:var(--red)}
  #screen .dim{color:var(--gray-dim)}
  #screen a.link{color:var(--lime);text-decoration:underline;text-underline-offset:3px}
  #screen a.link:hover{background:var(--lime);color:var(--bg);text-decoration:none}

  .line{display:flex;align-items:baseline;padding:0 16px 16px;flex:0 0 auto}
  .ps1{color:var(--lime);white-space:pre;flex:0 0 auto}
  #cmd{
    flex:1 1 auto;background:transparent;border:0;outline:0;
    color:var(--gray);font:inherit;padding:0 0 0 0.6ch;caret-color:var(--lime);
  }

  /* editor overlay */
  #editor{
    position:fixed;inset:0;background:var(--bg);z-index:20;
    display:none;flex-direction:column;
  }
  #editor.open{display:flex}
  #edbar{
    padding:10px 16px;border-bottom:1px solid var(--rule);
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    font-size:11.5px;letter-spacing:0.05em;color:var(--gray-dim);
  }
  #edpath{color:var(--lime)}
  #edtext{
    flex:1;background:transparent;border:0;outline:0;resize:none;
    color:var(--gray);font:inherit;line-height:1.6;padding:16px;
    tab-size:4;caret-color:var(--lime);
  }
  .btn{
    background:transparent;border:1px solid var(--lime);color:var(--lime);
    font:inherit;font-size:11.5px;letter-spacing:0.05em;
    padding:0.4em 0.9em;cursor:pointer;
  }
  .btn:hover{background:var(--lime);color:var(--bg)}
  .btn.ghost{border-color:var(--rule);color:var(--gray-dim)}
  .btn.ghost:hover{background:transparent;color:var(--gray);border-color:var(--gray-dim)}
  .btn[disabled]{opacity:0.45;cursor:default}
  .btn[disabled]:hover{background:transparent;color:var(--lime)}

  /* account slot in the chrome bar */
  .chrome .right{display:flex;align-items:center;gap:1rem}
  #acct{color:var(--gray-dim)}
  #acct .who{color:var(--lime)}
  #acct button{
    background:transparent;border:0;padding:0;cursor:pointer;
    font:inherit;color:var(--gray-dim);text-decoration:underline;
    text-underline-offset:3px;
  }
  #acct button:hover{color:var(--lime)}

  /* sign-in overlay, same shape as the editor */
  #auth{
    position:fixed;inset:0;z-index:30;
    background:rgba(23,23,23,0.92);
    display:none;align-items:center;justify-content:center;padding:16px;
  }
  #auth.open{display:flex}
  #authbox{
    width:min(30rem,100%);
    border:1px solid var(--rule);
    background:var(--bg);
  }
  #authhead{
    padding:10px 16px;border-bottom:1px solid var(--rule);
    font-size:11.5px;letter-spacing:0.06em;color:var(--gray-dim);
  }
  #authhead b{color:var(--lime);font-weight:400}
  #authbody{padding:16px;display:grid;gap:0.9rem}
  #authbody label{display:grid;gap:0.35rem;font-size:11.5px;letter-spacing:0.05em;color:var(--gray-dim)}
  #authbody input{
    background:transparent;border:1px solid var(--rule);
    color:var(--gray);font:inherit;font-size:13.5px;
    padding:0.55em 0.7em;outline:0;caret-color:var(--lime);
  }
  #authbody input:focus{border-color:var(--lime);color:var(--lime)}
  #autherr{font-size:12px;color:var(--red);min-height:1.2em}
  #autherr:empty{display:none}
  #authrow{display:flex;gap:0.6rem;align-items:center;margin-top:0.2rem;flex-wrap:wrap}
  #authforgot{
    background:transparent;border:0;padding:0;cursor:pointer;margin-left:auto;
    font:inherit;font-size:11.5px;color:var(--gray-dim);
    text-decoration:underline;text-underline-offset:3px;
  }
  #authforgot:hover{color:var(--lime)}
  #authforgot[hidden]{display:none}
  #authswap{
    margin:0;font-size:12px;color:var(--gray-dim);
    border-top:1px solid var(--rule);padding:11px 16px;
  }
  #authswap button{
    background:transparent;border:0;padding:0;cursor:pointer;
    font:inherit;color:var(--gray);text-decoration:underline;text-underline-offset:3px;
  }
  #authswap button:hover{color:var(--lime)}

  a:focus-visible,.btn:focus-visible,#acct button:focus-visible,
  #authswap button:focus-visible,#authbody input:focus-visible{
    outline:2px solid var(--lime);outline-offset:2px;
  }
  ::selection{background:var(--lime);color:var(--bg)}
</style>

<body>

<div class="chrome">
  <span><a href="/"><span class="host">aifreeware.net</span></a> <span class="dim">/ <span id="cname">code-skool</span></span></span>
  <span class="right">
    <span id="acct">guest <button type="button" id="signin">sign in</button></span>

  </span>
</div>

<div id="screen"></div>

<form class="line" id="form" autocomplete="off">
  <span class="ps1" id="ps1">$ </span>
  <input id="cmd" name="cmd" spellcheck="false" autocapitalize="off" autocorrect="off" disabled>
</form>

<div id="editor">
  <div id="edbar">
    <span>editing <span id="edpath"></span></span>
    <span>
      <button class="btn" id="edsave" type="button">save and close</button>

<div id="auth">
  <form id="authbox" autocomplete="on">
    <div id="authhead"><b id="authtitle">sign in</b> <span id="authwhy">so your work follows you to another machine</span></div>
    <div id="authbody">
      <label>email
        <input id="authemail" name="email" type="email" autocomplete="username"
               spellcheck="false" autocapitalize="off" required>
      </label>
      <label>password
        <input id="authpw" name="password" type="password" autocomplete="current-password"
               minlength="8" required>
      </label>
      <p id="autherr" role="alert"></p>
      <div id="authrow">
        <button class="btn" type="submit" id="authgo">sign in</button>
        <button class="btn ghost" type="button" id="authcancel">cancel</button>
        <button type="button" id="authforgot">forgot your password?</button>
      </div>
    </div>
    <p id="authswap">No account yet? <button type="button" id="authswapbtn">create one</button></p>
  </form>
</div>

<script>
const COURSES = {
  'code-skool': {pkg:'code_skool', title:'CODE Skool', weeks:6,
                 first:'work/week-01/ex01_variable_explorer.py', home:true, note:''},
  'py-skool':   {pkg:'py_skool',   title:'PY Skool',   weeks:9,
                 first:'work/week-01/ex01_command_dispatcher.py', home:true,
                 note:'Three week 8 exercises run other programs with subprocess, which a browser tab cannot do. Download the course for those. Everything else runs here, including the week 9 API work.'},
  'ai-skool':   {pkg:'ai_skool',   title:'AI Skool',   weeks:12,
                 first:'work/week-01/ex01_async_basics.py', home:false,
                 note:'One week 12 exercise runs another program with subprocess, which a browser tab cannot do. Download the course for that one. Everything else runs here.'}
};
const params = new URLSearchParams(location.search);
const COURSE = COURSES[params.get('c')] ? params.get('c') : 'code-skool';
const INFO   = COURSES[COURSE];
const PKG    = INFO.pkg;
const ROOT   = '/' + COURSE;
const LSKEY  = 'aifw:' + COURSE + ':work';
const ZIP    = 'https://github.com/evanacci/' + COURSE + '/archive/refs/heads/main.zip';
// Pyodide itself is loaded by run/py-worker.js, not here.

const screenEl = document.getElementById('screen');
const cmdEl    = document.getElementById('cmd');
const ps1El    = document.getElementById('ps1');
const statusEl = document.getElementById('status');
let cwd = ROOT, history = [], hpos = 0;

/* ---------- output ---------- */
const ANSI = {30:'#171717',31:'#ff8d8d',32:'#b8e986',33:'#e2f79c',34:'#8ab4f8',
              35:'#ff8dc5',36:'#8de3f7',37:'#d8d8d8',90:'#5a5a5a',91:'#ff8d8d',
              92:'#b8e986',93:'#e2f79c',94:'#8ab4f8',95:'#ff8dc5',96:'#8de3f7',97:'#f2f2f2'};

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

/* Convert the ANSI the course actually emits into spans. */
function ansiToHtml(text){
  if(text.indexOf('[2J')>-1){ screenEl.innerHTML=''; }
  text = text.replace(/\[2J/g,'').replace(/\[H/g,'');
  let out='', open=0, i=0;
  const re=/\[([0-9;]*)m/g; let m, last=0;
  while((m=re.exec(text))!==null){
    out += esc(text.slice(last, m.index));
    last = re.lastIndex;
    const codes = m[1].split(';').filter(Boolean).map(Number);
    if(codes.length===0 || codes.includes(0)){
      while(open>0){ out+='</span>'; open--; }
      continue;
    }
    let style='';
    for(const c of codes){
      if(c===1) style+='font-weight:700;';
      else if(ANSI[c]) style+='color:'+ANSI[c]+';';
    }
    if(style){ out+='<span style="'+style+'">'; open++; }
  }
  out += esc(text.slice(last));
  while(open>0){ out+='</span>'; open--; }
  return out;
}

function write(text, cls){
  const span=document.createElement('span');
  if(cls) span.className=cls;
  span.innerHTML = ansiToHtml(text);
  screenEl.appendChild(span);
  screenEl.scrollTop = screenEl.scrollHeight;
}
const line = (t,c)=>write((t??'')+'\n',c);

// write() escapes everything it prints, which is the right default for program
// output. A link has to be built as a real element instead.
function writeLink(url){
  const a=document.createElement('a');
  a.href=url; a.target='_blank'; a.rel='noopener';
  a.textContent=url;
  a.className='link';
  screenEl.appendChild(a);
  screenEl.appendChild(document.createTextNode('\n'));
  screenEl.scrollTop=screenEl.scrollHeight;
}

/* ---------- virtual filesystem helpers ---------- */
const norm = p => {
  const abs = p.startsWith('/') ? p : cwd + '/' + p;
  const parts=[];
  for(const seg of abs.split('/')){
    if(!seg || seg==='.') continue;
    if(seg==='..') parts.pop(); else parts.push(seg);
  }
  return '/'+parts.join('/');
};
const rel = p => p===ROOT ? '~' : p.startsWith(ROOT+'/') ? '~/'+p.slice(ROOT.length+1) : p;

function setPrompt(){ ps1El.textContent = rel(cwd) + ' $ '; }

/* ---------- the Python worker ----------
   Python lives in a worker so input() can block and a runaway loop can be
   interrupted. Nothing here touches the filesystem directly any more; every
   read and write is a message. Walking and batch writes stay on the worker
   side, because doing those a file at a time would be hundreds of round trips. */
let worker = null, stdinReady = false;
let ctl = null, sbuf = null, interruptBuf = null;

const pending = new Map();
let msgId = 0;

function ask(op, ...args){
  return new Promise((res, rej) => {
    const id = ++msgId;
    pending.set(id, { res, rej });
    worker.postMessage({ type:'fs', id, op, args });
  });
}
const fsList   = p => ask('list', p);
const fsStat   = p => ask('stat', p);
const fsRead   = p => ask('read', p);
const fsWrite  = (p, c) => ask('write', p, c);
const fsCollect = () => ask('collect');
const fsRestore = files => ask('restore', files);

/* ---------- accounts ----------
   Better Auth's REST endpoints are called directly. The site has no build
   step, so pulling in the client bundle would mean adding one for four fetches.
   The session cookie is httpOnly and set by the server; nothing here reads it. */
const AUTH = '/api/auth';
let USER = null;

async function authApi(path, body){
  const res = await fetch(AUTH+path, {
    method: body===undefined ? 'GET' : 'POST',
    headers: body===undefined ? undefined : {'content-type':'application/json'},
    body: body===undefined ? undefined : JSON.stringify(body),
    credentials:'same-origin'
  });
  let d=null; try{ d=await res.json(); }catch{}
  if(!res.ok){
    const said = d && (d.message || d.error);
    if(said) throw new Error(said);
    // No JSON body means the service itself is down, not a bad password.
    throw new Error(res.status >= 500
      ? 'The sign-in service is not responding. Try again in a moment.'
      : 'The sign-in service turned that down ('+res.status+').');
  }
  return d;
}

async function refreshSession(){
  try{ const d=await authApi('/get-session'); USER=(d && d.user) || null; }
  catch{ USER=null; }
  paintAccount();
  return USER;
}

function paintAccount(){
  const el=document.getElementById('acct');
  el.textContent='';
  if(USER){
    const who=document.createElement('span');
    who.className='who'; who.textContent=USER.email;
    const out=document.createElement('button');
    out.type='button'; out.textContent='sign out';
    out.onclick=()=>doLogout();
    el.append(who, document.createTextNode(' '), out);
  }else{
    const b=document.createElement('button');
    b.type='button'; b.textContent='sign in';
    b.onclick=async ()=>{
      const u=await openAuth('signin');
      if(u){ line('Signed in as '+u.email,'dim'); await mergeAccountWork(); }
    };
    el.append(document.createTextNode('guest '), b);
  }
}

/* Better Auth's messages are written for developers. These are the ones a
   student can actually hit, said plainly. */
function authMessage(msg){
  const m=String(msg||'').toLowerCase();
  if(m.includes('already exists')||m.includes('already registered'))
    return 'That email already has an account. Try signing in instead.';
  if(m.includes('invalid email')||m.includes('valid email'))
    return 'That does not look like an email address.';
  if(m.includes('invalid')&&(m.includes('password')||m.includes('credential')))
    return 'That email and password do not match.';
  if(m.includes('password')&&(m.includes('short')||m.includes('least')||m.includes('8')))
    return 'Use at least 8 characters for the password.';
  if(m.includes('failed to fetch')||m.includes('networkerror')||m.includes('load failed'))
    return 'Could not reach the sign-in service. Check your connection.';
  return msg;
}

const authEl=document.getElementById('auth');
const authForm=document.getElementById('authbox');
const authEmail=document.getElementById('authemail');
const authPw=document.getElementById('authpw');
const authErr=document.getElementById('autherr');
const authGo=document.getElementById('authgo');
const authTitle=document.getElementById('authtitle');
const authWhy=document.getElementById('authwhy');
const authSwap=document.getElementById('authswap');
const authSwapBtn=document.getElementById('authswapbtn');
const authForgot=document.getElementById('authforgot');
let authMode='signin', authDone=null;

function paintAuthMode(){
  const up = authMode==='signup';
  authTitle.textContent = up ? 'create an account' : 'sign in';
  authWhy.textContent = up
    ? 'free, and only so your work follows you to another machine'
    : 'so your work follows you to another machine';
  authGo.textContent = up ? 'create account' : 'sign in';
  authPw.autocomplete = up ? 'new-password' : 'current-password';
  authSwap.firstChild.textContent = up ? 'Already have one? ' : 'No account yet? ';
  authSwapBtn.textContent = up ? 'sign in' : 'create one';
  authForgot.hidden = up;
  authErr.textContent='';
}

/* Forgetting the password would otherwise mean losing the saved work for good,
   which is the one thing the account is here to prevent. The reply is the same
   whether or not the address has an account, so this cannot be used to find out
   who has one. */
async function requestReset(){
  const email = authEmail.value.trim();
  if(!email){
    authErr.textContent = 'Type your email address first, then ask for a reset.';
    authEmail.focus();
    return;
  }
  const label = authForgot.textContent;
  authErr.textContent = ''; authForgot.disabled = true; authForgot.textContent = 'sending';
  try{
    await authApi('/request-password-reset', { email, redirectTo: '/reset/' });
    closeAuth(null);
    line('If '+email+' has an account, a link to set a new password is on its way.','dim');
    line('The link works once and expires in an hour.','dim');
  }catch(err){
    authErr.textContent = authMessage(err.message);
  }finally{
    authForgot.disabled = false; authForgot.textContent = label;
  }
}

function openAuth(mode){
  authMode = mode==='signup' ? 'signup' : 'signin';
  paintAuthMode();
  authEl.classList.add('open');
  setTimeout(()=>(authEmail.value ? authPw : authEmail).focus(), 0);
  return new Promise(res=>{ authDone=res; });
}
function closeAuth(result){
  authEl.classList.remove('open');
  authPw.value='';
  const done=authDone; authDone=null;
  if(done) done(result||null);
  if(!edEl.classList.contains('open')) cmdEl.focus();
}

authForm.addEventListener('submit', async e=>{
  e.preventDefault();
  const email=authEmail.value.trim(), password=authPw.value;
  if(!email || !password) return;
  const label=authGo.textContent;
  authErr.textContent=''; authGo.disabled=true; authGo.textContent='working';
  try{
    if(authMode==='signup') await authApi('/sign-up/email',{email, password, name:email.split('@')[0]});
    else                    await authApi('/sign-in/email',{email, password});
    await refreshSession();
    if(!USER) throw new Error('signed in, but no session came back');
    closeAuth(USER);
  }catch(err){
    authErr.textContent = authMessage(err.message);
    authPw.select();
  }finally{
    authGo.disabled=false; authGo.textContent=label;
  }
});
document.getElementById('authcancel').onclick=()=>closeAuth(null);
authForgot.onclick=()=>requestReset();
authSwapBtn.onclick=()=>{ authMode = authMode==='signup' ? 'signin' : 'signup'; paintAuthMode(); authEmail.focus(); };
authEl.addEventListener('keydown', e=>{ if(e.key==='Escape'){ e.preventDefault(); closeAuth(null); } });

async function doLogout(){
  if(!USER) return line('You are not signed in.','dim');
  const who=USER.email;
  await pushWork(true);
  try{ await authApi('/sign-out',{}); }catch{}
  USER=null; paintAccount();
  statusEl.textContent='ready'; statusEl.className='ready';
  line('Signed out of '+who+'. Your work stays in this browser.','dim');
}

/* ---------- persistence: only the student's own work/ files ----------
   Two copies exist. localStorage is the one that always works, including
   signed out and offline. The account copy is what lets them move machines.
   Every save writes the browser copy first, then tries the account. */

/* work/ ships with a starter file per exercise. Those are course files, not
   student work, so the worker holds them aside at load and anything still
   identical to its starter is skipped. Without this every account would be
   handed a copy of all 40-odd untouched templates, and a second machine would
   see each pristine file as a conflict with the one actually edited. */
const collectWork = () => fsCollect().then(r => r.files);
const writeWork   = files => fsRestore(files).then(r => r.written);

function localWork(){
  try{ return JSON.parse(localStorage.getItem(LSKEY)||'{}'); }catch{ return {}; }
}
async function saveLocal(store){
  try{ localStorage.setItem(LSKEY, JSON.stringify(store || await collectWork())); }
  catch(e){ line('Could not save in this browser: '+e.message,'err'); }
}
async function saveWork(){
  await saveLocal();
  if(USER) queuePush();
}

/* ---------- the account copy ---------- */
let pushTimer=null, pushing=false, pushAgain=false;

function setSync(state){
  if(!USER) return;
  statusEl.textContent=state;
  statusEl.className = state==='saved' ? 'ready' : '';
  if(state==='saved') setTimeout(()=>{
    if(statusEl.textContent==='saved'){ statusEl.textContent='ready'; statusEl.className='ready'; }
  }, 1400);
}

function queuePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(()=>pushWork(true), 1200); }

async function pushWork(quiet){
  if(!USER) return 0;
  if(pushing){ pushAgain=true; return 0; }
  pushing=true; setSync('saving');
  try{
    const res=await fetch('/api/progress',{
      method:'PUT',
      headers:{'content-type':'application/json'},
      credentials:'same-origin',
      body:JSON.stringify({course:COURSE, files: await collectWork()})
    });
    if(res.status===401){
      USER=null; paintAccount();
      line('Your session expired. Type login to save to your account again.','err');
      return 0;
    }
    const d=await res.json().catch(()=>null);
    if(!res.ok) throw new Error((d && d.error) || ('the server said '+res.status));
    setSync('saved');
    return d ? d.saved : 0;
  }catch(e){
    setSync('not saved');
    if(!quiet) line('Could not save to your account: '+e.message,'err');
    return 0;
  }finally{
    pushing=false;
    if(pushAgain){ pushAgain=false; queuePush(); }
  }
}

async function pullWork(){
  const res=await fetch('/api/progress?course='+encodeURIComponent(COURSE),{credentials:'same-origin'});
  if(!res.ok) throw new Error('the server said '+res.status);
  const d=await res.json();
  return (d && d.files) || {};
}

/* A file edited here while signed out can differ from the account copy. Rather
   than pick a winner silently, keep the account version where it belongs and
   park this browser's version next to it. Nothing a student typed is thrown
   away without them seeing it. */
function browserCopyPath(p){
  const dot=p.lastIndexOf('.'), slash=p.lastIndexOf('/');
  return dot>slash ? p.slice(0,dot)+'.browser-copy'+p.slice(dot) : p+'.browser-copy';
}

async function mergeAccountWork(){
  let remote;
  try{ remote=await pullWork(); }
  catch(e){ line('Signed in, but could not read your saved work: '+e.message,'err'); return; }

  const local=await collectWork();
  const conflicts={};
  let onlyHere=0;

  for(const [p,content] of Object.entries(local)){
    if(!(p in remote)) onlyHere++;
    else if(remote[p]!==content) conflicts[browserCopyPath(p)]=content;
  }

  const restored=await writeWork(remote);
  const parked=await writeWork(conflicts);
  await saveLocal();

  if(restored) line('Restored '+restored+' file'+(restored===1?'':'s')+' from your account.','dim');
  if(parked){
    line(parked+' file'+(parked===1?'':'s')+' here did not match your account. Yours '
       + (parked===1?'was':'were')+' kept alongside, named .browser-copy','dim');
  }
  if(onlyHere){
    await pushWork(true);
    line('Sent '+onlyHere+' file'+(onlyHere===1?'':'s')+' from this browser up to your account.','dim');
  }
  if(!restored && !parked && !onlyHere){
    line('Nothing saved for this course yet. It will save as you go.','dim');
  }
}

/* ---------- python execution ---------- */
let running = false, interrupted = false;

async function runPy(code){
  running = true; interrupted = false;
  if(stdinReady) interruptBuf[0] = 0;
  try{
    const { code: status, error } = await ask_run(code);
    if(!error) return status;

    // A clean SystemExit is how the course signals a bad week number.
    // An interrupt during input() surfaces as EOFError, because unblocking the
    // waiting worker is what lets it notice the signal at all.
    if(/KeyboardInterrupt/.test(error) || (interrupted && /EOFError/.test(error))){
      line('^C','dim');
      return 130;
    }
    // WASM has no process model at all, so this one cannot be shimmed the way
    // sockets were. Say so plainly rather than showing an errno.
    if(/does not support processes|Errno 138/i.test(error)){
      line('This exercise runs another program with subprocess, and a browser tab '
         + 'has no processes to run.','err');
      line('Type download to get the course and run this one on your own machine. '
         + 'Everything else works here.','dim');
      return 1;
    }
    if(/EOFError/.test(error) && !stdinReady){
      line('This program asks you a question with input(), and this browser '
         + 'cannot type answers back.','err');
      line('Type download to get the course and run this one on your own machine. '
         + 'Everything that does not use input() works here.','dim');
      return 1;
    }
    line(error.split('\n').slice(-14).join('\n').trim(),'err');
    return 1;
  } finally {
    running = false;
    endInput();
  }
}

function ask_run(code){
  return new Promise((res, rej) => {
    const id = ++msgId;
    pending.set(id, { res, rej });
    worker.postMessage({ type:'run', id, code });
  });
}

/* ---------- commands ---------- */
const HELP = `
Commands

  ls [path]           list files here
  cd <path>           change folder
  pwd                 where am I
  cat <file>          read a file
  edit <file>         open a file, write your code, save
  python <file>       run a python file
  python -m ${PKG} [args]
                      open the course, or a week
  clear               clear the screen
  download            get this course to keep, and run it on your own machine
  reset               throw away your saved work and start fresh
  help                this

  Ctrl+C              stop a program that is running or stuck

Your account

  login               sign in, so your work follows you to another machine
  signup              create a free account
  logout              sign out
  whoami              who is signed in
  sync                save to your account right now

Try this first

  cat START_HERE.md
  python -m ${PKG}
  cat weeks/week-01/README.md
  edit ${INFO.first}
  python ${INFO.first}
`;

async function exec(raw){
  const argv = raw.trim().split(/\s+/).filter(Boolean);
  if(!argv.length) return;
  const [cmd, ...rest] = argv;

  switch(cmd){
    case 'help': line(HELP); return;
    case 'clear': screenEl.innerHTML=''; return;
    case 'pwd': line(rel(cwd)); return;

    case 'ls': {
      const target = norm(rest[0] || '.');
      const r = await fsList(target);
      if(r.kind === 'file') return line(rel(target));
      if(r.kind !== 'dir') return line('ls: no such folder: '+(rest[0]||'.'),'err');
      const dirs = r.entries.filter(e=>e.dir).map(e=>e.name+'/');
      const files = r.entries.filter(e=>!e.dir).map(e=>e.name);
      line([...dirs, ...files].join('   '));
      return;
    }

    case 'cd': {
      if(!rest[0]) { cwd = ROOT; setPrompt(); return; }
      const target = norm(rest[0]);
      const s = await fsStat(target);
      if(!s || !s.dir) return line('cd: no such folder: '+rest[0],'err');
      cwd = target; setPrompt(); return;
    }

    case 'cat': {
      if(!rest[0]) return line('cat: which file?','err');
      const r = await fsRead(norm(rest[0]));
      if(!r.ok) return line('cat: no such file: '+rest[0],'err');
      line(r.content);
      return;
    }

    case 'edit': {
      if(!rest[0]) return line('edit: which file?','err');
      const target = norm(rest[0]);
      const r = await fsRead(target);
      if(!r.ok) return line('edit: no such file: '+rest[0],'err');
      openEditor(target, r.content);
      return;
    }

    case 'login': case 'signin': {
      if(USER) return line('Already signed in as '+USER.email+'.','dim');
      const u=await openAuth('signin');
      if(!u) return;
      line('Signed in as '+u.email,'dim');
      await mergeAccountWork();
      return;
    }

    case 'signup': case 'register': {
      if(USER) return line('Already signed in as '+USER.email+'. Type logout first.','dim');
      const u=await openAuth('signup');
      if(!u) return;
      line('Account created. Signed in as '+u.email,'dim');
      await mergeAccountWork();
      return;
    }

    case 'logout': case 'signout': await doLogout(); return;

    case 'whoami': {
      if(USER) return line(USER.email);
      line('guest. Your work saves in this browser only. Type login to keep it on your account.','dim');
      return;
    }

    case 'sync': {
      if(!USER) return line('Not signed in. Type login first.','err');
      const n=await pushWork();
      if(n) line('Saved '+n+' file'+(n===1?'':'s')+' to your account.','dim');
      return;
    }

    case 'download': {
      line('Download '+COURSE+' and keep it. No account, works offline, yours forever.','dim');
      writeLink(ZIP);
      line('Unzip it anywhere, then double click install-mac.command on a Mac or\ninstall-windows.bat on Windows. You need Python 3.11 or newer.','dim');
      return;
    }

    case 'reset': {
      localStorage.removeItem(LSKEY);
      if(!USER) return line('Saved work cleared. Reload the page to start fresh.','dim');
      try{
        const res=await fetch('/api/progress?course='+encodeURIComponent(COURSE),
                              {method:'DELETE', credentials:'same-origin'});
        if(!res.ok) throw new Error('the server said '+res.status);
        line('Saved work cleared here and on your account. Reload the page to start fresh.','dim');
      }catch(e){
        line('Cleared in this browser, but could not clear your account: '+e.message,'err');
      }
      return;
    }

    case 'python': case 'python3': {
      if(!rest.length) return line('This terminal cannot run the interactive prompt yet. Try: python -m '+PKG,'err');
      if(rest[0]==='-m'){
        const mod = rest[1];
        if(!mod) return line('python: -m needs a module name','err');
        const args = JSON.stringify(rest.slice(2));
        await runPy(`_aifw_run_module(${JSON.stringify(mod)}, ${args})`);
        return;
      }
      const target = norm(rest[0]);
      const s = await fsStat(target);
      if(!s || !s.file) return line('python: no such file: '+rest[0],'err');
      const args = JSON.stringify(rest.slice(1));
      await runPy(`_aifw_run_path(${JSON.stringify(target)}, ${args})`);
      return;
    }

    default:
      line(cmd+': not a command here. Type help.','err');
  }
}

/* ---------- editor ---------- */
const edEl=document.getElementById('editor'), edText=document.getElementById('edtext'),
      edPath=document.getElementById('edpath');
let editing=null;
function openEditor(path, content){
  editing=path;
  edPath.textContent=rel(path);
  edText.value=content;
  edEl.classList.add('open');
  edText.focus();
}
async function closeEditor(save){
  const path=editing, text=edText.value;
  editing=null; edEl.classList.remove('open'); cmdEl.focus();
  if(save && path){
    await fsWrite(path, text);
    if(path.startsWith(ROOT+'/work')) await saveWork();
    line('saved '+rel(path),'dim');
  }
}
document.getElementById('edsave').onclick=()=>closeEditor(true);
document.getElementById('edcancel').onclick=()=>closeEditor(false);
edText.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ e.preventDefault(); closeEditor(false); }
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){ e.preventDefault(); closeEditor(true); }
  if(e.key==='Tab'){
    e.preventDefault();
    const s=edText.selectionStart, en=edText.selectionEnd;
    edText.value=edText.value.slice(0,s)+'    '+edText.value.slice(en);
    edText.selectionStart=edText.selectionEnd=s+4;
  }
});

/* ---------- answering input() ----------
   While a program waits on input(), the same prompt line becomes the program's
   input rather than a command line. The worker is genuinely blocked in
   Atomics.wait until a line is handed over, which is what makes input() behave
   the way it does in a real terminal. */
let inputMode = false;

function beginInput(){
  inputMode = true;
  ps1El.textContent = '';          // the program prints its own prompt
  cmdEl.disabled = false;
  cmdEl.focus();
}
function endInput(){
  // Always restore the prompt, even when inputMode is already false. Answering
  // the last input() clears the flag, so an early return here would leave the
  // prompt blank for the next command.
  inputMode = false;
  cmdEl.value = '';
  setPrompt();
}
function supplyStdin(text){
  const bytes = new TextEncoder().encode(text);
  const n = Math.min(bytes.length, sbuf.length);
  sbuf.set(bytes.subarray(0, n), 0);
  Atomics.store(ctl, 1, n);
  Atomics.store(ctl, 0, 1);
  Atomics.notify(ctl, 0);
}
function supplyEOF(){
  Atomics.store(ctl, 0, 2);
  Atomics.notify(ctl, 0);
}

document.getElementById('form').addEventListener('submit', async e=>{
  e.preventDefault();
  const raw=cmdEl.value;
  cmdEl.value='';

  if(inputMode){
    line(raw,'u');
    inputMode = false;
    cmdEl.disabled = true;
    supplyStdin(raw + '\n');
    return;
  }

  write(ps1El.textContent); line(raw,'u');
  if(raw.trim()){ history.push(raw); hpos=history.length; }
  cmdEl.disabled=true;
  try{ await exec(raw); } finally { cmdEl.disabled=false; cmdEl.focus(); }
  screenEl.scrollTop=screenEl.scrollHeight;
});

/* Ctrl+C. On Windows and Linux this is also copy, so only take it when a
   program is actually running and nothing is selected. */
document.addEventListener('keydown', e=>{
  if(!(e.ctrlKey && (e.key==='c' || e.key==='C'))) return;
  if(!running || window.getSelection().toString()) return;
  e.preventDefault();
  interrupted = true;
  if(stdinReady){
    if(inputMode){
      // The worker is parked in Atomics.wait, not running Python, so it cannot
      // see the interrupt buffer. Waking it with EOF is what stops the program.
      // Arming SIGINT as well would land KeyboardInterrupt and EOFError together
      // inside the stdin callback, and the run then never settles at all, so the
      // signal is armed a moment later, only if the program is still going.
      supplyEOF();
      setTimeout(() => { if(running) interruptBuf[0] = 2; }, 60);
    }else{
      interruptBuf[0] = 2;        // SIGINT, polled by Python between opcodes
    }
  }else{
    line('\n^C  This browser cannot interrupt a running program. Reload the page to stop it.','err');
  }
});

cmdEl.addEventListener('keydown',e=>{
  if(inputMode) return;           // history is for commands, not answers
  if(e.key==='ArrowUp'){ e.preventDefault(); if(hpos>0){ hpos--; cmdEl.value=history[hpos]; } }
  if(e.key==='ArrowDown'){ e.preventDefault(); if(hpos<history.length-1){ hpos++; cmdEl.value=history[hpos]; } else { hpos=history.length; cmdEl.value=''; } }
});
document.addEventListener('mouseup',()=>{
  if(edEl.classList.contains('open') || authEl.classList.contains('open')) return;
  if(!window.getSelection().toString()) cmdEl.focus();
});

/* ---------- boot ---------- */
(async function boot(){
  document.title = INFO.title + ' in your browser';
  document.getElementById('cname').textContent = COURSE;
  paintAccount();
  // Fire this now and read it after Pyodide lands, rather than paying for it twice.
  const session = refreshSession();
  line(INFO.title);
  line('Real Python, running in this tab. Your code runs in your own browser,\nnever on a server. Your saved work goes to your account so you can pick this\nup on another machine.\n','dim');

  try{
    // Blocking stdin needs a SharedArrayBuffer, which needs the page to be
    // cross-origin isolated (the COOP/COEP headers in netlify.toml). Where that
    // is unavailable the terminal still works, input() just reports EOF as before.
    if(self.crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined'){
      const sab = new SharedArrayBuffer(8 + 65536);
      ctl  = new Int32Array(sab, 0, 2);
      sbuf = new Uint8Array(sab, 8);
      interruptBuf = new Uint8Array(new SharedArrayBuffer(1));
      stdinReady = true;
      var initSab = sab;
    }

    worker = new Worker('./py-worker.js', { type:'module' });
    worker.onerror = ev => {
      statusEl.textContent='failed';
      line('\nThe Python worker could not start: '+(ev.message||'unknown error'),'err');
      line('The course still runs on your own machine. Download it here:','dim');
      writeLink(ZIP);
    };

    const booted = new Promise((res, rej) => {
      worker.onmessage = ev => {
        const m = ev.data;
        if(m.type === 'out')        return write(m.text, m.err ? 'err' : null);
        if(m.type === 'stage')      return m.dim ? line(m.text.trimEnd(),'dim') : write(m.text);
        if(m.type === 'stdin:want') return beginInput();
        if(m.type === 'ready')      return res(m);
        if(m.type === 'failed')     return rej(new Error(m.error));
        if(m.type === 'reply'){
          const p = pending.get(m.id);
          if(!p) return;
          pending.delete(m.id);
          return m.ok ? p.res(m.value) : p.rej(new Error(m.error));
        }
      };
    });

    worker.postMessage({
      type:'init', root:ROOT, sab: initSab, interrupt: interruptBuf,
      bundleUrl: new URL('./'+COURSE+'.json', location.href).href,
    });

    const info = await booted;
    line('ok, '+info.files+' files','dim');

    // The browser copy goes down first so there is always something to work
    // with, even if the account is unreachable.
    const restored = await writeWork(localWork());
    await session;
    if(USER){
      line('Signed in as '+USER.email,'dim');
      await mergeAccountWork();
    }else{
      if(restored) line('Restored '+restored+' file'+(restored===1?'':'s')+' you had been working on in this browser.','dim');
      line('Working as a guest. Your work saves in this browser only. Type login to keep it on your account.','dim');
    }

    statusEl.textContent='ready'; statusEl.className='ready';
    if(INFO.note) line('\n' + INFO.note, 'dim');
    line('\nType help to see what you can do, or cat START_HERE.md to begin.\n','dim');
    setPrompt();
    cmdEl.disabled=false; cmdEl.focus();
  }catch(e){
    statusEl.textContent='failed';
    line('\n'+e.message,'err');
    // The prompt never opens after a failed boot, so the download command is
    // unreachable here. Print the link itself.
    line('The course still runs on your own machine. Download it here:','dim');
    writeLink(ZIP);
  }
})();
