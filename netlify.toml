[build]
  publish = "."
  command = ""

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "."
  port = 8888

# The site publishes from the repo root, so the build tooling, the schema and
# the function source would otherwise be served as ordinary static files. The
# repo is public, so this is tidiness rather than secrecy: the site should
# serve the site. Anything added here needs its own line, which is the cost of
# publishing from the root rather than from a build directory.
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/db/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/deno.lock"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/build-icons.py"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/build-course-bundle.py"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/test-auth.mjs"
  to = "/"
  status = 404
  force = true

# /ub is a verbatim copy of the shared utility-bar module, kept whole so it can
# be diffed and re-copied. Its .js files are the site's chrome and must serve.
# These three are the module's own tooling and docs, not site files, so they get
# the same treatment as the build scripts above. /ub/demo.html would also be
# broken here: it loads the module from the root, which is not where it lives.
[[redirects]]
  from = "/ub/README.md"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/ub/build.sh"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/ub/demo.html"
  to = "/"
  status = 404
  force = true

# Cross-origin isolation, which is what makes SharedArrayBuffer available. The
# browser terminal needs it so input() can genuinely block the Python worker and
# so a runaway loop can be interrupted. Scoped to /run/ on purpose: the landing
# page and the auth API have no need of it and should not inherit the
# restriction. Pyodide is served by jsDelivr with Cross-Origin-Resource-Policy,
# so require-corp does not block it.
[[headers]]
  for = "/run/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/run/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
